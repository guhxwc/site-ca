<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título e descrição padrão (home). Cada rota sobrescreve isso via
         lib/useSEO.ts assim que a página monta — ver comentário lá sobre o
         motivo (SPA sem SSR/prerender) e a recomendação de médio prazo. -->
    <title>C.A. Rodrigues | Transportadora de Cargas Siderúrgicas e Perfis de Alumínio</title>
    <meta name="description" content="Transportadora especializada em cargas siderúrgicas e perfis de alumínio, sediada em Sarandi-PR. Atendimento nacional, desde 2012. Solicite uma cotação." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://carodrigues.com/" />

    <!-- Favicon / ícones -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#D92323" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="C.A. Rodrigues Transportes" />
    <meta property="og:title" content="C.A. Rodrigues | Transportadora de Cargas Siderúrgicas e Perfis de Alumínio" />
    <meta property="og:description" content="Transportadora especializada em cargas siderúrgicas e perfis de alumínio, sediada em Sarandi-PR. Atendimento nacional, desde 2012." />
    <meta property="og:url" content="https://carodrigues.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Roboto+Condensed:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">

    <!-- Schema base da empresa (Organization/LocalBusiness). A página inicial
         também injeta uma versão via JS (lib/schema.ts) — ter esta aqui garante
         que até um crawler que não execute JS veja a entidade correta. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://carodrigues.com/#organization",
        "name": "C. A. Rodrigues Transportes",
        "legalName": "C. A. Rodrigues dos Santos Transportes ME",
        "url": "https://carodrigues.com",
        "telephone": "+5544999240991",
        "email": "carlosrodrigues.transportes@gmail.com",
        "foundingDate": "2012",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Sarandi",
          "addressRegion": "PR",
          "addressCountry": "BR"
        },
        "areaServed": [
          { "@type": "City", "name": "Sarandi", "containedInPlace": { "@type": "State", "name": "Paraná" } },
          { "@type": "City", "name": "Maringá", "containedInPlace": { "@type": "State", "name": "Paraná" } },
          { "@type": "City", "name": "Arapongas", "containedInPlace": { "@type": "State", "name": "Paraná" } },
          { "@type": "Country", "name": "Brasil" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
